# ==============================================================================
# FILE: config/config.yaml
# TYPE: SYSTEM CONFIGURATION
# AUDIT:
#   1. Generalized MT5 Path (Removed hardcoded user path).
#   2. Clarified Risk Semantics (Exposure Count).
#   3. Bumped Version to 14.3 (Institutional).
# STATUS: PRODUCTION READY
# ==============================================================================

system:
  app_name: "Titan_ICT_Institutional"
  version: "14.3_Institutional"
  database_path: "data/db/titan_core.db"
  magic_number_base: 88000
  
  # AUDIT FIX: WATCHDOG CONFIGURATION
  # Path to terminal64.exe. Used by SystemController to auto-restart MT5 if it crashes.
  # Default: "C:\Program Files\MetaTrader 5\terminal64.exe"
  # Update this if your Broker installs to a different folder (e.g., "MetaTrader 5 IC Markets")
  mt5_path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"

connection:
  zeromq:
    push_port: 32768  # Commands (Py -> MT5)
    pull_port: 32769  # Data (MT5 -> Py)
    host: "127.0.0.1"
  broker:
    # Hours offset from UTC. e.g. 2 = UTC+2 (EET/standard Forex server time)
    timezone_offset: 2 

risk:
  account:
    max_daily_drawdown_pct: 3.0  # Circuit Breaker: Stop trading if equity drops 3% in a day
    
    # AUDIT NOTE: Although named 'pct', the ExposureManager treats this as an INTEGER COUNT.
    # Logic: Maximum total number of simultaneous open positions allowed.
    max_global_exposure_pct: 6.0 # e.g., Max 6 trades at once
    
  trade:
    risk_per_trade_pct: 1.0     # Risk 1% of Equity per trade
    hard_max_lots: 5.0          # Absolute Cap to prevent fat-finger errors
    static_commission_usd: 7.0  # Used for Net-Risk Calculation ($7.00 per round turn lot)

# v14.4: Confluence grading. Every signal is scored 0-100 (HTF bias alignment,
# R:R, displacement, premium/discount location, killzone timing) and journaled;
# only signals at or above min_grade are executed.
# Grades: A++ (>=90) | A+ (>=80) | A (>=70) | B (>=55) | C (below).
signal_grading:
  enabled: true
  min_grade: "B"

# v14.4: In-trade management. The Fibonacci ratchet (BE at 38.2%, bank 30% at
# 61.8%, bank 50% at 88.6%) is always on. Runner mode additionally REMOVES the
# TP at the 88.6% stage and trails the remaining tail behind price.
# v14.4.2: runner ON — validated on 3yr H1 study (fixed 2R was net-negative;
# ratchet+runner is what makes SilverBullet net-positive). See
# docs/research/2026-07-11-silverbullet-h1-stop-study.md.
trade_management:
  runner:
    enabled: true
    # Arm C (validated 2026-07-11, docs/research/2026-07-11-pullback-monetizer-overlay-results.md):
    # once a runner pullback gives back >= giveback_frac of the trail distance from its
    # high-water mark, tighten the trail from 0.268x to tight_trail_frac x range (one-way).
    # Ships OFF — enable for the FBS demo-forward-test before going live.
    tighten_on_giveback: false
    giveback_frac: 0.75
    tight_trail_frac: 0.10

strategies:
  # 1. Silver Bullet (FVG displacement, H1)
  # v14.4.2 VALIDATED CONFIG (3yr, net of costs, OOS-consistent: +0.19R/trade,
  # PF 1.53, ~12 trades/wk — docs/research/2026-07-11-silverbullet-h1-stop-study.md).
  # Do NOT move back to M5 or shrink stop_atr without re-running the cost study:
  # the old M5/0.2-ATR config nets ≈ −4.3R/trade after spreads.
  silver_bullet:
    enabled: true
    timeframe: "H1"
    stop_atr: 1.0          # SL = entry ± 1.0 × ATR(14)
    windows: [[0, 24]]     # no session gate (edge validated all-hours on H1)
    risk_reward: 2.0
    # Cost-viable universe (median round-trip cost ≤ 0.25R at the 1.0-ATR stop);
    # GBPCAD/XBRUSD excluded — spreads too wide for the stop size.
    pairs: ["EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "USDCAD",
            "GBPJPY", "XAUUSD", "US30", "BTCUSD"]
  
  # 2. Unicorn (Breaker + FVG + Sweep)
  # Requires Liquidity Sweep confirmation before entry
  unicorn_model:
    enabled: false
    scan_depth: 50     # Lookback candles for Breaker Block
    min_atr_size: 1.5  # Displacement Strength threshold
    pairs: ["BTCUSD", "EURUSD", "GBPUSD", "XAUUSD", "GBPJPY", "USDJPY"]
  
  # 3. ICT OTE (Trend Continuation)
  # Optimal Trade Entry (Fibo 0.705)
  ict_ote:
    enabled: false
    ote_level: 0.705
    min_swing_atr: 2.0 # Swing depth requirement
    pairs: ["EURUSD", "GBPUSD", "AUDUSD", "BTCUSD", "USDCAD", "XAUUSD"]

  # 4. CRT (Mean Reversion - Counter Trend)
  # Candle Range Theory: Previous Day High/Low sweeps
  crt:
    enabled: false
    trend_filter: true # If True: Only fade Highs in Bear Trend / Lows in Bull Trend
    active_hours: [2, 17] # Broker Time active window
    pairs: ["EURUSD", "GBPUSD", "USDJPY", "XAUUSD"]