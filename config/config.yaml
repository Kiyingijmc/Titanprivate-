# ==============================================================================
# FILE: config/config.yaml
# TYPE: SYSTEM CONFIGURATION
# AUDIT:
#   1. Generalized MT5 Path (Removed hardcoded user path).
#   2. Clarified Risk Semantics (Exposure Count).
#   3. Bumped Version to 14.3 (Institutional).
# STATUS: PRODUCTION READY
# ==============================================================================

system:
  app_name: "Titan_ICT_Institutional"
  version: "14.3_Institutional"
  database_path: "data/db/titan_core.db"
  magic_number_base: 88000
  
  # AUDIT FIX: WATCHDOG CONFIGURATION
  # Path to terminal64.exe. Used by SystemController to auto-restart MT5 if it crashes.
  # Default: "C:\Program Files\MetaTrader 5\terminal64.exe"
  # Update this if your Broker installs to a different folder (e.g., "MetaTrader 5 IC Markets")
  mt5_path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"

connection:
  zeromq:
    push_port: 32768  # Commands (Py -> MT5)
    pull_port: 32769  # Data (MT5 -> Py)
    host: "127.0.0.1"
  broker:
    # Hours offset from UTC. e.g. 2 = UTC+2 (EET/standard Forex server time)
    timezone_offset: 2 

risk:
  account:
    max_daily_drawdown_pct: 3.0  # Circuit Breaker: Stop trading if equity drops 3% in a day
    
    # AUDIT NOTE: Although named 'pct', the ExposureManager treats this as an INTEGER COUNT.
    # Logic: Maximum total number of simultaneous open positions allowed.
    max_global_exposure_pct: 6.0 # e.g., Max 6 trades at once

    # v15 Plan 10 Advisory A: portfolio-wide ceiling on TOTAL open risk-to-stop
    # (this one really is a percent of live equity, unlike the count above).
    # Summed across every COMMITTED entry -- open positions, resting LIMIT/STOP
    # orders, and anything dispatched earlier in the same bar sweep -- plus the
    # trade being proposed; over the cap, the trade is blocked at
    # _execute_signal. At the shipped 1%/trade the count gate alone would permit
    # 6% of equity at risk simultaneously, so 5.0 binds one trade earlier.
    # Conservative starting value -- tune post-deploy.
    # The sum is deliberately over-stated for ratcheted trades (a stop moved
    # past entry counts as risk, not as locked-in profit) and includes
    # commission, matching the net-risk basis the position sizer uses.
    # FAILS CLOSED, BOOK-WIDE: if any single committed row's risk is unknown
    # (a stopless position, or a symbol whose broker specs never loaded) the
    # gate blocks EVERY symbol until it clears, and Telegrams the operator.
    max_total_open_risk_pct: 5.0


  trade:
    risk_per_trade_pct: 1.0     # Risk 1% of Equity per trade
    hard_max_lots: 5.0          # Absolute Cap to prevent fat-finger errors
    static_commission_usd: 7.0  # Used for Net-Risk Calculation ($7.00 per round turn lot)

  # v15.2: config-gated intraday drawdown throttle. Ships OFF (factor stays
  # 1.0, byte-identical sizing) -- flip `enabled` on to halve (or scale by
  # `factor`) new-trade risk once the day's equity has fallen `trigger_dd_pct`%
  # below the daily anchor (RiskManager.day_start_equity, same anchor used by
  # the existing daily-drawdown circuit breaker).
  drawdown_throttle:
    enabled: false
    trigger_dd_pct: 2.0
    factor: 0.5

# v15.2: Arbiter -- deterministic conflict-resolution stage between strategy
# signal generation and _execute_signal (src/arbiter/arbiter.py). Defaults
# match Plan 05 / Task 2. Single-strategy live config never exercises dedup/
# opposition/caps in a way that changes outcomes -- see test_signal_parity.
arbiter:
  opposition_policy: "higher_grade_wins"   # or "block_both"
  max_positions_per_symbol: 1
  max_total_positions: 6
  # Counted in bars of the thesis's OWN timeframe (v15 Advisory C): 12 here
  # means 12 H1 bars for an H1 thesis and 12 M5 bars for an M5 one -- not 12
  # ticks of a single shared counter. Matters once an M5 strategy activates.
  thesis_ttl_bars: 12

# v14.4: Confluence grading. Every signal is scored 0-100 (HTF bias alignment,
# R:R, displacement, premium/discount location, killzone timing) and journaled;
# only signals at or above min_grade are executed.
# Grades: A++ (>=90) | A+ (>=80) | A (>=70) | B (>=55) | C (below).
signal_grading:
  enabled: true
  min_grade: "B"
  # Minimal P8 carve-out: per-strategy grade floors by strategy NAME. The
  # grader's factors are SMC-shaped, so a non-SMC canary (Almanac) would be
  # probabilistically gated by irrelevant factors; "C" makes its known-in-
  # advance schedule deterministic while grades are still journaled.
  per_strategy_min_grade:
    Almanac: "C"
    Gyroscope: "C"

# v14.4: In-trade management. The Fibonacci ratchet (BE at 38.2%, bank 30% at
# 61.8%, bank 50% at 88.6%) is always on. Runner mode additionally REMOVES the
# TP at the 88.6% stage and trails the remaining tail behind price.
# v14.4.2: runner ON — validated on 3yr H1 study (fixed 2R was net-negative;
# ratchet+runner is what makes SilverBullet net-positive). See
# docs/research/2026-07-11-silverbullet-h1-stop-study.md.
trade_management:
  runner:
    enabled: true
    # Arm C (validated 2026-07-11, docs/research/2026-07-11-pullback-monetizer-overlay-results.md):
    # once a runner pullback gives back >= giveback_frac of the trail distance from its
    # high-water mark, tighten the trail from 0.268x to tight_trail_frac x range (one-way).
    # Enabled 2026-07-28 for the FBS demo-forward-test (was shipped OFF).
    tighten_on_giveback: true
    giveback_frac: 0.75
    tight_trail_frac: 0.10
  # Calendar time exits by strategy NAME (src/analysis/trading_days.py):
  # close once the turn-of-month window has passed (start of trading day
  # exit_trading_day+1 of the following month). Inert for absent strategies.
  time_exits:
    Almanac: { exit_trading_day: 3 }
    Gyroscope: { max_bars: 48 }   # v2b gate: close after 48 H1 bars

strategies:
  # 1. Silver Bullet (FVG displacement, H1)
  # v14.4.2 VALIDATED CONFIG (3yr, net of costs, OOS-consistent: +0.19R/trade,
  # PF 1.53, ~12 trades/wk — docs/research/2026-07-11-silverbullet-h1-stop-study.md).
  # Do NOT move back to M5 or shrink stop_atr without re-running the cost study:
  # the old M5/0.2-ATR config nets ≈ −4.3R/trade after spreads.
  silver_bullet:
    enabled: true
    timeframe: "H1"
    stop_atr: 1.0          # SL = entry ± 1.0 × ATR(14)
    windows: [[0, 24]]     # no session gate (edge validated all-hours on H1)
    risk_reward: 2.0
    # Cost-viable universe (median round-trip cost ≤ 0.25R at the 1.0-ATR stop);
    # GBPCAD/XBRUSD excluded — spreads too wide for the stop size.
    # US100/ETHUSD added 2026-07-28 (owner-ratified expansion screen,
    # docs/research/2026-07-28-universe-expansion-screen.md); XTIUSD added
    # 2026-07-29 after its London/NY-overlap spread re-measure (median 2 pts,
    # n=20 — well under the 5-pt gate; screen verdict +0.421R stands).
    pairs: ["EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "USDCAD",
            "GBPJPY", "XAUUSD", "US30", "BTCUSD", "US100", "ETHUSD", "XTIUSD"]

  # 2. Gyroscope v2 (Kalman drift + innovation-SPRT, H1) — arsenal #1.
  # v1 velocity-SPRT NO-GO 2026-07-14; v2b innovation-SPRT GO 7/7
  # (docs/research/2026-08-01-gyroscope2b-gate-results.md). Values below are
  # the v2b PRE-REGISTERED gate values — do not tune. Trend-prone universe
  # only (FX excluded by mechanism, audit F8). max_bars_in_trade is enforced
  # live via trade_management.time_exits (Gyroscope: max_bars).
  gyroscope:
    enabled: true
    timeframe: "H1"
    warmup_bars: 200
    q_atr_frac: 0.05
    r_frac: 1.0
    sprt: { alpha: 0.05, beta: 0.20, delta: 0.40 }
    sprt_on: "innovation"
    z_confirm: 1.0
    nis_window: 50
    nis_persist: 10
    k_sl: 3.0
    sl_atr_floor: 0.8
    rr_target: 2.0
    max_bars_in_trade: 48
    reentry_lockout: 12
    max_spread_atr_frac: 0.10
    pairs: ["BTCUSD", "ETHUSD", "XAUUSD", "US30", "US100", "XTIUSD"]

  # 3. Almanac — turn-of-month index canary (docs/strategies/almanac.md).
  # ZERO fitted parameters by design: long US30/US100 from the last trading
  # day of the month through trading day 3 of the next. Role = integration
  # canary (signals known months ahead → live-vs-backtest divergence is an
  # infrastructure bug) + standing complexity baseline. n=36 on current data:
  # NOT statistically validated and not expected to be until the D1 history
  # extension (P10). Manifest status research; enable explicitly for the soak.
  almanac:
    enabled: true   # demo-soak canary, operator-enabled 2026-08-01
    timeframe: "H1"
    entry_hour: 16        # broker hour: first H1 close >= this on the last trading day
    stop_atr_d1: 2.0      # protective stop = 2 x daily ATR (resampled from H1)
    atr_period_d1: 14     # 14 not 20: the 500-bar live H1 buffer can't feed ATR(20,D1)
    tp_risk_mult: 10.0    # far TP anchor: keeps ratchet dormant, avoids tp=0 registration
    pairs: ["US30", "US100"]

  # 4. MA-slope baseline — Gyroscope gate criterion 6 reference ONLY.
  # Never a live candidate; stays research forever.
  ma_slope_baseline:
    enabled: true
    timeframe: "H1"
    ma_window: 24
    stop_atr: 1.0
    rr_target: 2.0

ops:
  journal:
    enabled: true
    dir: data/journal
    tick_sample: 50
  health:
    enabled: true
    bind: 127.0.0.1
    port: 8787

# Economic calendar. ForexFactory is the PRIMARY source; MT5 is a fallback
# added in a later session. Only High ("red folder") events halt trading, and
# only for symbols exposed to the event's currency.
news:
  enabled: true
  refresh_interval_min: 60
  # Retry cadence while trading is halted on a stale cache -- much shorter
  # than refresh_interval_min so a boot-time fetch failure recovers in
  # minutes, not up to an hour, without hammering the feed every loop tick.
  stale_retry_interval_min: 1
  window_pre_min: 60
  window_post_min: 30
  max_cache_age_hours: 48
  cache_path: "data/news/calendar.json"
  # The live feed's Date/Time columns are UTC (verified against FOMC 6:00pm =
  # 18:00Z). This key exists only so an operator can hotfix a future feed
  # timezone change without a code deploy -- leave it "UTC" otherwise.
  csv_timezone: "UTC"
  symbol_currencies:
    EURUSD: [EUR, USD]
    GBPUSD: [GBP, USD]
    USDJPY: [USD, JPY]
    AUDUSD: [AUD, USD]
    USDCAD: [USD, CAD]
    GBPJPY: [GBP, JPY]
    XAUUSD: [USD]
    US30:   [USD]
    US100:  [USD]
    BTCUSD: [USD]
    ETHUSD: [USD]
    XTIUSD: [USD]
