[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.0.1"
description = "New-generation ICT/SMC trading engine (M0 skeleton) — independent of the src/ Titan v14 bot."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
include = ["tradebot*"]
