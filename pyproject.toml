[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.0.1"
description = "New-generation ICT/SMC trading engine (M0 skeleton) — independent of the src/ Titan v14 bot."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    # core/event_log.py archives aged events to Parquet (pass3-systems.md §1.3).
    "pyarrow>=15.0",
]

[project.optional-dependencies]
# Test-only. Deliberately NOT in [project] dependencies — nothing importing
# tradebot at runtime needs a property-based testing library. Install with
# `pip install -e .[test]`. pass3-systems.md §7.2 names this library for the
# property tier; it is unittest-native, so no pytest is implied.
test = ["hypothesis>=6,<7"]

[tool.setuptools.packages.find]
include = ["tradebot*"]
